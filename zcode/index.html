<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>天工营造 · 3D 体素中国古典建筑群 (Voxel Chinese Palace)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0b0f19;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }
    #loading-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1e293b 0%, #0a0e17 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      color: #f1c40f;
      font-family: "Noto Serif SC", "STSong", serif;
    }
    #loading-screen.fade-out {
      opacity: 0;
      visibility: hidden;
    }
    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(243, 156, 18, 0.2);
      border-top-color: #f1c40f;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-title {
      font-size: 24px;
      letter-spacing: 4px;
      color: #ffffff;
      margin-bottom: 8px;
    }
    .loading-sub {
      font-size: 13px;
      letter-spacing: 2px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="loading-spinner"></div>
    <div class="loading-title">天工营造 · 体素紫宸</div>
    <div class="loading-sub">正在构建古典建筑体素群与光影系统...</div>
  </div>

  <div id="canvas-container"></div>

  <script type="module" src="/src/main.js"></script>
  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('loading-screen');
        if (loader) loader.classList.add('fade-out');
      }, 400);
    });
  </script>
</body>
</html>
